<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .contenedor-base {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            gap: 20px;
        }

        .contenedor-principal {
            width: 90%;
            max-width: 1000px;
            margin: 40px auto;
            display: flex;
            flex-direction: column;
            margin-top: 5%;
            justify-content: space-evenly;
            flex-wrap: wrap;
            align-content: center;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .contenedor {
            background-color: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .contenedor h2 {
            margin-top: 0;
        }

        .formulario {
            display: flex;
            gap: 10px;
        }

        .formulario input,
        .formulario select {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #333;
            color: white;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        .producto-input,
        .stock-input {
            width: 100%;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .acciones {
            display: flex;
            gap: 5px;
        }
    </style>
</head>

<body>

    <div th:replace="~{Fragmentos/header :: header}"></div>

    <div class="contenedor-base">
        <div class="contenedor-principal">

            <h1>Administración de Productos</h1>

            <div class="contenedor">

                <h2>Crear producto</h2>

                <form class="formulario" id="formProducto">

                    <input type="text" id="productoNombre" placeholder="Nombre del producto" required>

                    <input type="number" id="productosCantidadStock" placeholder="Cantidad en stock" min="0" required>

                    <select id="sucursalId" required>

                        <option value="">Seleccione una sucursal</option>

                        <option th:each="sucursal : ${sucursales}" th:value="${sucursal.idSucursal}"
                            th:text="${sucursal.nombreSucursal}">
                        </option>

                    </select>

                    <button type="submit">
                        Agregar
                    </button>

                </form>

            </div>

            <div class="contenedor">

                <h2>Productos registrados</h2>

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Producto</th>
                            <th>Stock</th>
                            <th>Sucursal</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody>

                        <tr th:each="producto : ${productos}">

                            <td th:text="${producto.idProducto}"></td>

                            <td>

                                <span class="producto-texto" th:text="${producto.nombreProducto}">
                                </span>

                                <input type="text" class="producto-input" th:value="${producto.nombreProducto}"
                                    style="display: none;">

                            </td>

                            <td>

                                <span class="stock-texto" th:text="${producto.cantidadProductoStock}">
                                </span>

                                <input type="number" class="stock-input" th:value="${producto.cantidadProductoStock}"
                                    min="0" style="display: none;">

                            </td>

                            <td th:text="${producto.nombreSucursal}"></td>

                            <td>

                                <div class="acciones">

                                    <button type="button" class="btn-editar" th:data-id="${producto.idProducto}"
                                        onclick="activarEdicion(this)">
                                        Editar
                                    </button>

                                    <button type="button" class="btn-guardar" th:data-id="${producto.idProducto}"
                                        onclick="guardarEdicion(this)" style="display: none;">
                                        Guardar
                                    </button>

                                    <button type="button" class="btn-cancelar" onclick="cancelarEdicion(this)"
                                        style="display: none;">
                                        Cancelar
                                    </button>

                                    <button type="button" class="btn-eliminar"
                                        th:onclick="'eliminarProducto(' + ${producto.idProducto} + ')'">
                                        Eliminar
                                    </button>

                                </div>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

        <div class="contenedor-principal">
            <div class="contenedor">

                <h2>Productos con mayor stock por sucursal</h2>

                <div class="formulario">

                    <select id="franquiciaStock">
                        <option value="">Seleccione una franquicia</option>

                        <option th:each="franquicia : ${franquicias}" th:value="${franquicia.idFranquicia}"
                            th:text="${franquicia.nombreFranquicia}">
                        </option>
                    </select>

                    <button type="button" onclick="consultarMayorStock()">
                        Consultar
                    </button>

                </div>

                <div id="resultadoMayorStock" style="display: none;">

                    <table>

                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th>Stock</th>
                                <th>Sucursal</th>
                            </tr>
                        </thead>

                        <tbody id="tablaMayorStock">
                        </tbody>

                    </table>

                </div>

            </div>

        </div>
    </div>

    <script th:src="@{/Productos/Productos.js}"></script>

</body>

</html>
